[project]
name = "brickforge"
version = "0.1.0"
description = "Convert a 3D mesh into a validated LEGO-compatible brick build with assembly steps."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "trimesh>=4.4,<5",
    "shapely>=2.0,<3",
    "pydantic>=2.8,<3",
    "mapbox-earcut>=1.0,<2",
    "rtree>=1.3,<2",
    "scipy>=1.14,<2",
]

[project.scripts]
brickforge = "brickcore.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brickcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
